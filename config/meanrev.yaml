strategy: meanrev

params:
  z_entry: 2.0
  rsi_entry: 30
  rsi_exit: 55
  max_bars: 12
  sl_atr_mult: 2.0

market:
  pair: SOL
  kraken_pair: SOLUSD
  interval: "5"
  data_file: data/solusdt_5m_30d.csv

account:
