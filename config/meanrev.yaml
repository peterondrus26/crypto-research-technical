  initial_asset_allocation: 0.40
  trading_fee: 0.0026

volatility:
  atr_percentile: 60
  atr_lookback_periods: 50
  atr_min: 0.0015

safety:
  max_daily_loss: -2.0
  max_consecutive_losses: 5
  daily_max_trades: 25

adaptive:
  enabled: false